name: Full Stack Application Deployment Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  COMPOSE_PROJECT_NAME: myapp

jobs:
  deploy-and-test:
    # Критерий 1: Используем наш Mac как runner (3 балла)
    runs-on: self-hosted 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file from secrets
        # Критерий 3: Генерируем .env из секретов (1 балл)
        run: |
          cat > .env << EOF
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          APP_PORT=${{ secrets.APP_PORT }}
          APP_SECRET=${{ secrets.APP_SECRET }}
          API_KEY=${{ secrets.API_KEY }}
          COMPOSE_PROJECT_NAME=${{ env.COMPOSE_PROJECT_NAME }}
          EOF
          echo ".env created successfully"

      - name: Deploy with Docker Compose
        # Критерий 2: Запуск докера (1 балл)
        run: |
          docker compose down || true
          docker compose up -d --build
          echo "Waiting for services to start..."
          sleep 15
          docker compose ps

      - name: Verify containers are running
        # Критерий 2: Проверка, что контейнеры работают (1 балл)
        run: |
          if docker compose ps | grep -q "Up"; then
            echo "All containers are running"
          else
            echo "Some containers failed to start"
            docker compose logs
            exit 1
          fi

      - name: Run application tests
        # Критерий 4: Тесты приложения и БД (2 балла)
        run: |
          echo "1. Testing application and database connectivity..."
          # ВАЖНО: замените порт и эндпоинт /health на те, что есть в вашем бэкенде!
          # Если бэкенд работает на 8080, напишите http://localhost:8080/health
          if curl -f http://localhost:${{ secrets.APP_PORT }}/health; then
            echo "Web application is healthy"
          else
            echo "Web application health check failed"
            exit 1
          fi

          echo "2. Testing data consistency..."
          # ВАЖНО: Эта часть может не сработать, если у вас нет БД в докере.
          # Если БД есть, убедитесь, что имя сервиса в docker-compose.yml совпадает (например, 'db')
          # Если нет, просто закомментируйте эту часть.
          DB_COUNT=$(docker compose exec -T db psql -U ${{ secrets.DB_USER }} -d ${{ secrets.DB_NAME }} -t -c "SELECT COUNT(*) FROM items;" | tr -d ' ' || echo "0")
          WEB_COUNT=$(curl -s http://localhost:${{ secrets.APP_PORT }}/api/items/count || echo "0")
          echo "DB Count: $DB_COUNT, Web API Count: $WEB_COUNT"
          if [ "$DB_COUNT" = "$WEB_COUNT" ]; then
            echo "Data consistency test passed"
          else
            echo "Data consistency test failed"
            exit 1
          fi

      - name: Create test report
        if: always()
        run: |
          cat > test-report.md << EOF
          # Deployment Test Report
          - Date: $(date)
          - Status: Completed
          EOF

      - name: Save Docker logs
        if: always()
        run: |
          docker compose logs > deployment-logs.txt || true
          docker ps -a > docker-ps.txt || true
          docker images > docker-images.txt || true

      - name: Upload artifacts
        # Критерий 3: Сохранение артефактов (2 балла)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-artifacts
          path: |
            .env
            test-report.md
            deployment-logs.txt
            docker-ps.txt
            docker-images.txt
          retention-days: 30

      - name: Cleanup
        if: always()
        run: docker compose down || true
