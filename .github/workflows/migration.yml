name: Idempotent Mattermost Migration & Upgrade
on:
  push:
    branches: [ "migration" ]
  workflow_dispatch:

env:
  COMPOSE_FILE: docker-compose.prod.yml

jobs:
  migrate-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Проверка идемпотентности
      - name: Check Migration Status
        id: check_status
        run: |
          if [ -f "$HOME/.mattermost_migration_completed" ]; then
            echo "already_migrated=true" >> $GITHUB_OUTPUT
          else
            echo "already_migrated=false" >> $GITHUB_OUTPUT
          fi

      # 2. Бэкап
      - name: Backup Legacy MySQL
        if: steps.check_status.outputs.already_migrated == 'false'
        run: |
          BACKUP_NAME="mattermost_mysql_backup_${{ github.run_id }}.sql"
          docker exec mattermost-mysql mysqldump -u root -p${{ secrets.DB_MYSQL_ROOT_PASSWORD }} mattermost > $BACKUP_NAME
          echo "Backup saved as $BACKUP_NAME"

      # 3. Запуск Postgres
      - name: Start Target PostgreSQL
        if: steps.check_status.outputs.already_migrated == 'false'
        run: |
          docker compose -f $COMPOSE_FILE up -d mattermost-postgres
          sleep 10

      # 4. Миграция (Исправлены имена хостов!)
      - name: Run pgloader
        if: steps.check_status.outputs.already_migrated == 'false'
        run: |
          docker run --rm --platform linux/amd64 --network=mattermost_network \
            mattermost/mattermost-pgloader:latest pgloader \
            --with "include drop" \
            mysql://root:${{ secrets.DB_MYSQL_ROOT_PASSWORD }}@mattermost-mysql/mattermost \
            postgresql://mmuser:${{ secrets.DB_POSTGRES_PASSWORD }}@mattermost-postgres/mattermost

      # 5. Флаг-файл
      - name: Mark Migration as Completed
        if: steps.check_status.outputs.already_migrated == 'false'
        run: touch $HOME/.mattermost_migration_completed

      # 6. Деплой
      - name: Deploy Upgraded Stack
        run: |
          docker rm -f mattermost mattermost-mysql || true
          docker compose -f $COMPOSE_FILE up -d --remove-orphans

      # 7. Проверка
      - name: Run Health Checks
        run: |
          sleep 10
          if curl -f http://localhost:8065/api/v4/system/ping; then
            echo "Success!"
          else
            docker compose -f $COMPOSE_FILE logs
            exit 1
          fi
