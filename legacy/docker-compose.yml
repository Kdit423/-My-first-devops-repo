services:
  mattermost:
    image: mattermost/mattermost-team-edition:9.5
    container_name: mattermost
    ports:
      - "8065:8065"
    environment:
      - MM_SQLSETTINGS_DRIVERNAME=mysql
      - MM_SQLSETTINGS_DATASOURCE=root:MyRootPass123@tcp(mattermost-mysql:3306)/mattermost
      - MM_SQLSETTINGS_DATASOURCESSLMODE=disabled
      - MM_SERVICESETTINGS_SITEURL=http://localhost:8065
      - MM_TEAMSETTINGS_ENABLEOPENSERVER=false
    volumes:
      - mattermost_data:/mattermost/data
      - mattermost_logs:/mattermost/logs
    networks:
      - mattermost_network
    depends_on:
      - mattermost-mysql
    restart: unless-stopped

  mattermost-mysql:
    image: mysql:8.0
    container_name: mattermost-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=MyRootPass123
      - MYSQL_DATABASE=mattermost
      - MYSQL_USER=mmuser
      - MYSQL_PASSWORD=MyUserPass123
      - TZ=UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_general_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - mattermost_network
    restart: unless-stopped

networks:
  mattermost_network:
    name: mattermost_network # ЖЕСТКОЕ ИМЯ СЕТИ

volumes:
  mattermost_data:
    name: mattermost_data   # ЖЕСТКОЕ ИМЯ ТОМА
  mattermost_logs:
    name: mattermost_logs
  mysql_data:
    name: mysql_data
