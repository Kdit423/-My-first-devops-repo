services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Фиксированный тег вместо latest: понятно, какая версия запущена.
    image: app-backend:1.0.0
    container_name: app
    ports:
      - "8080:8080"            # единственный порт, открытый наружу
    environment:
      HTTP_PORT: "8080"
      STATIC_DIR: /app/static
      DB_HOST: db              # имя сервиса = имя хоста во внутренней сети
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-app}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      DB_NAME: ${DB_NAME:-appdb}
    volumes:
      # Фронтенд монтируем только для чтения (:ro), контейнер не сможет его изменить.
      - ./frontend:/app/static:ro
    depends_on:
      db:
        # Ждём не просто старта контейнера БД, а её готовности принимать соединения.
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_net

  db:
    image: postgres:16-alpine
    container_name: app-db
    environment:
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: ${DB_NAME:-appdb}
    # ports НЕТ намеренно: БД доступна только внутри сети app_net.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app} -d ${DB_NAME:-appdb}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - db_data:/var/lib/postgresql/data          # данные БД переживают перезапуск
      - ./init:/docker-entrypoint-initdb.d:ro     # SQL выполняется при первом старте
    restart: unless-stopped
    networks:
      - app_net

volumes:
  db_data:

networks:
  app_net:
    driver: bridge
